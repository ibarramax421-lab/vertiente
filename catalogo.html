
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertiente Natural - Catálogo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#030d1a;color:#e0f0ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
.header{background:linear-gradient(135deg,#031a0f,#042d1a);padding:24px 18px 20px;text-align:center;border-bottom:1px solid #1a5c3a;}
.header img{width:72px;height:72px;object-fit:contain;border-radius:14px;margin-bottom:10px;}
.header h1{font-size:22px;font-weight:900;color:#00d4ff;}
.header p{font-size:12px;color:#6aaddf;margin-top:4px;}
.container{padding:16px 14px 100px;max-width:560px;margin:0 auto;}
.nombre-box{background:#063d22;border:1px solid #1a5c3a;border-radius:13px;padding:16px;margin-bottom:16px;}
.nombre-box label{font-size:11px;color:#6aaddf;font-weight:700;text-transform:uppercase;display:block;margin-bottom:6px;}
.nombre-box input{width:100%;background:#031a0f;border:1px solid #1a5c3a;color:#e0f0ff;border-radius:8px;padding:12px;font-size:16px;}
.nombre-box input:focus{outline:none;border-color:#00d4ff;}
.producto{background:#063d22;border:1px solid #1a5c3a;border-radius:13px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;}
.producto img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid #1a5c3a;flex-shrink:0;}
.producto-icon{width:72px;height:72px;border-radius:10px;background:#031a0f;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
.producto-info{flex:1;}
.producto-nombre{font-weight:800;font-size:15px;color:#e0f0ff;margin-bottom:4px;}
.producto-precio{color:#4ade80;font-weight:700;font-size:14px;margin-bottom:8px;}
.producto-badge{background:#042d1a;color:#7eeeff;border:1px solid #00d4ff;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;display:inline-block;margin-bottom:8px;}
.cantidad-control{display:flex;align-items:center;gap:10px;}
.cantidad-control button{width:36px;height:36px;border-radius:50%;border:none;background:#16a34a;color:#fff;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cantidad-control span{font-size:20px;font-weight:900;min-width:30px;text-align:center;color:#e0f0ff;}
.resumen{background:#052e16;border:2px solid #16a34a;border-radius:13px;padding:16px;margin-bottom:16px;}
.resumen h3{color:#4ade80;font-size:14px;font-weight:700;margin-bottom:10px;}
.resumen-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a5c3a;font-size:13px;}
.resumen-total{display:flex;justify-content:space-between;padding:10px 0 0;font-size:16px;font-weight:900;color:#4ade80;}
.btn-pedir{width:100%;background:#25D366;color:#fff;border:none;border-radius:13px;padding:16px;font-size:17px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-pedir:disabled{background:#1a5c3a;cursor:not-allowed;opacity:.5;}
.loading{text-align:center;padding:40px;color:#6aaddf;}
</style>
</head>
<body>
<div class="header">
<img src="logo.png" onerror="this.style.display='none'"/>
<h1>Vertiente Natural</h1>
<p>Agua purificada a domicilio</p>
</div>
<div class="container">
<div class="nombre-box">
<label>Tu nombre</label>
<input type="text" id="nombre" placeholder="Escribí tu nombre..." oninput="actualizarResumen()"/>
</div>
<div id="productos"><div class="loading">Cargando productos...</div></div>
<div id="resumen" style="display:none">
<div class="resumen">
<h3>Tu pedido</h3>
<div id="resumen-items"></div>
<div class="resumen-total"><span>Total</span><span id="resumen-total">$0</span></div>
</div>
<button class="btn-pedir" id="btn-pedir" onclick="enviarPedido()">💧 Enviar pedido por WhatsApp</button>
</div>
</div>
<script>
const SUPA_URL="https://hscbupttqtoemdrlewcv.supabase.co";
const SUPA_KEY="sb_publishable_Bc-ry-rPe7ev6PoEx7xhyA_TXSgqvIN";
const cantidades={};
const NUMEROS=["5492473506895","5492473411061"];
const params=new URLSearchParams(window.location.search);
const CLIENT_ID=params.get("cid")?Number(params.get("cid")):null;

async function cargar(){
const r=await fetch(SUPA_URL+"/rest/v1/productos?select=*&order=id",{headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}});
const prods=await r.json();
const div=document.getElementById("productos");
if(!prods||prods.length===0){div.innerHTML="<div class='loading'>Sin productos disponibles</div>";return;}
div.innerHTML=prods.filter(p=>p.price>0).map(p=>`
<div class="producto">
${p.foto_url?`<img src="${p.foto_url}" alt="${p.name}"/>`:`<div class="producto-icon">💧</div>`}
<div class="producto-info">
<div class="producto-nombre">${p.name}</div>
<div class="producto-precio">$${p.price.toLocaleString("es-AR")}</div>
<span class="producto-badge">${p.tipo_envase==="descartable"?"Descartable":"Retornable"}</span>
<div class="cantidad-control">
<button onclick="cambiar(${p.id},-1)">−</button>
<span id="cant-${p.id}">0</span>
<button onclick="cambiar(${p.id},1)">+</button>
</div>
</div>
</div>`).join("");
window._productos=prods;
}

function cambiar(id,delta){
cantidades[id]=(cantidades[id]||0)+delta;
if(cantidades[id]<0)cantidades[id]=0;
document.getElementById("cant-"+id).textContent=cantidades[id];
actualizarResumen();
}

function fmt(n){return"$"+n.toLocaleString("es-AR");}

function actualizarResumen(){
if(!window._productos)return;
const items=window._productos.filter(p=>cantidades[p.id]>0);
const total=items.reduce((a,p)=>a+p.price*cantidades[p.id],0);
if(items.length===0){document.getElementById("resumen").style.display="none";return;}
document.getElementById("resumen").style.display="block";
document.getElementById("resumen-items").innerHTML=items.map(p=>`<div class="resumen-item"><span>${cantidades[p.id]}x ${p.name}</span><span>${fmt(p.price*cantidades[p.id])}</span></div>`).join("");
document.getElementById("resumen-total").textContent=fmt(total);
}

async function enviarPedido(){
const nombre=document.getElementById("nombre").value.trim();
if(!nombre){alert("Por favor escribí tu nombre");document.getElementById("nombre").focus();return;}
const items=window._productos.filter(p=>cantidades[p.id]>0);
if(items.length===0){alert("Seleccioná al menos un producto");return;}
const total=items.reduce((a,p)=>a+p.price*cantidades[p.id],0);
const hoy=new Date().toISOString().slice(0,10);
if(CLIENT_ID){
try{
for(const item of items){
await fetch(SUPA_URL+"/rest/v1/pedidos_catalogo",{method:"POST",headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({clienteid:CLIENT_ID,productoid:item.id,cantidad:cantidades[item.id],total:item.price*cantidades[item.id],fecha:hoy,nombre_cliente:nombre,estado:"pendiente"})});
}
}catch(e){console.log("Error guardando pedido",e);}
}
let msg="Hola! Soy "+nombre+" y quiero hacer un pedido:\n\n";
items.forEach(p=>{msg+=cantidades[p.id]+"x "+p.name+" - "+fmt(p.price*cantidades[p.id])+"\n";});
msg+="\nTotal: "+fmt(total)+"\n\nGracias!";
NUMEROS.forEach((n,i)=>setTimeout(()=>window.open("https://wa.me/"+n+"?text="+encodeURIComponent(msg),"_blank"),i*500));
}

cargar();
</script>
</body>
</html>
